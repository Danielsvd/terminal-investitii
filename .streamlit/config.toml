# Tema aplicației: două moduri, comutate din meniul ⋮ → Settings → Theme.
# Decizia lui Daniel (27.11.2026): NOAPTEA = partea întunecată din „Nordic Frost” (varianta 6),
# ZIUA = partea luminoasă din „Neon Carbon” (varianta 5). Rolurile culorilor sunt în DESIGN.md.
# Aceleași culori sunt în ui/theme.py (TOKENS); testul tests/test_theme.py verifică să coincidă.
# Aici NU se pun chei sau secrete: acestea stau în .streamlit/secrets.toml (ignorat de git).

[theme]
baseFontSize = 15
metricValueFontSize = "26px"
metricValueFontWeight = 650
showWidgetBorder = true

[theme.dark]
# Nordic Frost: ardezie + albastru-gheață; Manrope (Google Fonts, rezervă: fontul de sistem)
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap, sans-serif"
baseRadius = "10px"
buttonRadius = "full"
# albastru fiord pe butonul principal (text alb 5,5:1); gheața deschisă e accentul de text și bare
primaryColor = "#1F6F99"
backgroundColor = "#0E1620"
secondaryBackgroundColor = "#16212D"
textColor = "#E8EEF4"
borderColor = "#273647"
linkColor = "#9AD3F0"
greenColor = "#6EE7B7"
redColor = "#FCA5A5"
yellowColor = "#FCD34D"
blueColor = "#7CC4E8"
dataframeBorderColor = "#273647"
dataframeHeaderBackgroundColor = "#1D2A38"
dataframeHeaderTextColor = "#9DAEC0"
chartCategoricalColors = ["#7CC4E8", "#F4B26A", "#B4A7F5", "#F49AC1", "#9CCB9A", "#9DAEC0"]

[theme.light]
# Neon Carbon: gri-verzui + cerneală, accent lime; Inter (text) + Space Grotesk (titluri)
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"
baseRadius = "12px"
buttonRadius = "full"
# cerneală pe butonul principal, cu text lime (tokenul on-accent din ui/theme.py)
primaryColor = "#0F1411"
backgroundColor = "#EEF1EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1411"
borderColor = "#DCE2DA"
linkColor = "#3D5E0B"
greenColor = "#116B37"
redColor = "#C0262D"
yellowColor = "#8A5A00"
blueColor = "#1D4ED8"
dataframeBorderColor = "#DCE2DA"
dataframeHeaderBackgroundColor = "#F4F6F2"
dataframeHeaderTextColor = "#566059"
chartCategoricalColors = ["#3D5E0B", "#1D4ED8", "#B45309", "#7C3AED", "#0F766E", "#566059"]
