# Tema aplicației: două moduri, comutate din meniul ⋮ → Settings → Theme.
# Valorile și rolul fiecăreia sunt în DESIGN.md (paleta „Nordic Frost”, aleasă pe 25.11.2026: varianta 6 de pe canvas; înlocuiește Swiss Bank).
# Aceleași culori sunt în ui/theme.py (TOKENS); testul tests/test_theme.py verifică să coincidă.
# Aici NU se pun chei sau secrete: acestea stau în .streamlit/secrets.toml (ignorat de git).

[theme]
# Manrope de la Google Fonts (încărcat de browser); dacă nu vine, rămâne fontul de sistem
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "full"
metricValueFontSize = "26px"
metricValueFontWeight = 650
showWidgetBorder = true

[theme.dark]
# albastru-gheață închis pentru butonul principal (text alb 5,5:1); gheața deschisă e accentul de text și bare
primaryColor = "#1F6F99"
backgroundColor = "#0E1620"
secondaryBackgroundColor = "#16212D"
textColor = "#E8EEF4"
borderColor = "#273647"
linkColor = "#9AD3F0"
greenColor = "#6EE7B7"
redColor = "#FCA5A5"
yellowColor = "#FCD34D"
blueColor = "#7CC4E8"
dataframeBorderColor = "#273647"
dataframeHeaderBackgroundColor = "#1D2A38"
dataframeHeaderTextColor = "#9DAEC0"
chartCategoricalColors = ["#7CC4E8", "#F4B26A", "#B4A7F5", "#F49AC1", "#9CCB9A", "#9DAEC0"]

[theme.light]
primaryColor = "#1F6F99"
backgroundColor = "#EDF2F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1E2C"
borderColor = "#D9E2EB"
linkColor = "#1A6489"
greenColor = "#0B7A55"
redColor = "#B42318"
yellowColor = "#8F5B00"
blueColor = "#1F6F99"
dataframeBorderColor = "#D9E2EB"
dataframeHeaderBackgroundColor = "#F2F6FA"
dataframeHeaderTextColor = "#526477"
chartCategoricalColors = ["#1F6F99", "#B45309", "#6D28D9", "#BE185D", "#3F7D3A", "#526477"]
