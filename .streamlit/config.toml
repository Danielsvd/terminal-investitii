# Tema aplicației: două moduri, comutate din meniul ⋮ → Settings → Theme.
# Valorile și rolul fiecăreia sunt în DESIGN.md (direcția „Bleumarin + Revolut”).
# Aici NU se pun chei sau secrete: acestea stau în .streamlit/secrets.toml (ignorat de git).

[theme]
font = "sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "full"
metricValueFontSize = "24px"
metricValueFontWeight = 600
showWidgetBorder = true

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E5ECF6"
borderColor = "#1F2A44"
linkColor = "#60A5FA"
greenColor = "#22C55E"
redColor = "#F87171"
yellowColor = "#FBBF24"
blueColor = "#3B82F6"
dataframeBorderColor = "#1F2A44"
dataframeHeaderBackgroundColor = "#18233B"
dataframeHeaderTextColor = "#8A97AD"
chartCategoricalColors = ["#3B82F6", "#F59E0B", "#14B8A6", "#A78BFA", "#F472B6", "#94A3B8"]

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#DCE2EC"
linkColor = "#1D4ED8"
greenColor = "#15803D"
redColor = "#B91C1C"
yellowColor = "#B45309"
blueColor = "#1D4ED8"
dataframeBorderColor = "#DCE2EC"
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeHeaderTextColor = "#526079"
chartCategoricalColors = ["#1D4ED8", "#B45309", "#0F766E", "#7C3AED", "#BE185D", "#475569"]
