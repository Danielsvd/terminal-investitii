# Tema aplicației: două moduri, comutate din meniul ⋮ → Settings → Theme.
# Valorile și rolul fiecăreia sunt în DESIGN.md (paleta „Indigo profund”, aleasă pe 10.11.2026).
# Aceleași culori sunt în ui/theme.py (TOKENS); testul tests/test_theme.py verifică să coincidă.
# Aici NU se pun chei sau secrete: acestea stau în .streamlit/secrets.toml (ignorat de git).

[theme]
font = "sans-serif"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "full"
metricValueFontSize = "24px"
metricValueFontWeight = 600
showWidgetBorder = true

[theme.dark]
primaryColor = "#6366F1"
backgroundColor = "#141230"
secondaryBackgroundColor = "#1C1940"
textColor = "#ECEAFB"
borderColor = "#2E2A5C"
linkColor = "#A5B4FC"
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
blueColor = "#818CF8"
dataframeBorderColor = "#2E2A5C"
dataframeHeaderBackgroundColor = "#242150"
dataframeHeaderTextColor = "#A09BC8"
chartCategoricalColors = ["#818CF8", "#F59E0B", "#14B8A6", "#F472B6", "#60A5FA", "#A09BC8"]

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F4F4FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16133A"
borderColor = "#E3E1F3"
linkColor = "#4338CA"
greenColor = "#047857"
redColor = "#B91C1C"
yellowColor = "#B45309"
blueColor = "#4F46E5"
dataframeBorderColor = "#E3E1F3"
dataframeHeaderBackgroundColor = "#F8F8FD"
dataframeHeaderTextColor = "#5F5A8A"
chartCategoricalColors = ["#4F46E5", "#B45309", "#0F766E", "#BE185D", "#1D4ED8", "#5F5A8A"]
